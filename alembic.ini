; ============================================================
; CPMS Backend - Alembic configuration (CPM-002)
; ============================================================

[alembic]
# Migrations live under backend/database/migrations, matching the project
# structure defined in the Software Architecture Document (Section 7.3),
# rather than Alembic's own top-level "alembic/" default.
script_location = backend/database/migrations

# Adds the project root to sys.path so env.py can `import backend...`.
prepend_sys_path = .

version_path_separator = os

# sqlalchemy.url is intentionally left unset here. It is populated at
# runtime by backend/database/migrations/env.py from the application's own
# Settings (backend.core.config.get_settings().database_url), so the
# database connection string is configured in exactly one place: .env.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
