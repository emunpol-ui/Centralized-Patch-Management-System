<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login &middot; Centralized Patch Management System</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link href="/static/css/dashboard.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm" style="width: 22rem;">
        <div class="card-body">
            <h1 class="h4 mb-3 text-center">CPMS</h1>
            <p class="text-muted text-center small mb-4">Centralized Patch Management System</p>

            <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>
        </div>
    </div>

    <script>
        // Consumes the existing, already-implemented POST /api/admin/login
        // endpoint (AUTH-001). No new authentication logic lives here -
        // this page only makes that endpoint reachable from a browser.
        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("loginError");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorBox.classList.add("d-none");

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({ username, password }),
                });
                const payload = await response.json();

                if (response.ok && payload.success) {
                    window.location.href = "/dashboard";
                    return;
                }
                errorBox.textContent = payload.message || "Invalid username or password.";
                errorBox.classList.remove("d-none");
            } catch (err) {
                errorBox.textContent = "Unable to reach the server. Please try again.";
                errorBox.classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
