<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CPMS{% endblock %} &middot; Centralized Patch Management System</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link href="/static/css/dashboard.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">CPMS</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#cpmsNavbar"
                aria-controls="cpmsNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="cpmsNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}"
                            {% if request.url.path == '/dashboard' %}aria-current="page"{% endif %}
                            href="/dashboard"
                        >Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.url.path.startswith('/dashboard/clients') %}active{% endif %}"
                            {% if request.url.path.startswith('/dashboard/clients') %}aria-current="page"{% endif %}
                            href="/dashboard/clients"
                        >Clients</a>
                    </li>
                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.url.path.startswith('/dashboard/repository') %}active{% endif %}"
                            {% if request.url.path.startswith('/dashboard/repository') %}aria-current="page"{% endif %}
                            href="/dashboard/repository"
                        >Repository</a>
                    </li>
                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.url.path == '/dashboard/deployments' %}active{% endif %}"
                            {% if request.url.path == '/dashboard/deployments' %}aria-current="page"{% endif %}
                            href="/dashboard/deployments"
                        >Deployments</a>
                    </li>
                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.url.path == '/dashboard/audit-logs' %}active{% endif %}"
                            {% if request.url.path == '/dashboard/audit-logs' %}aria-current="page"{% endif %}
                            href="/dashboard/audit-logs"
                        >Audit Logs</a>
                    </li>
                    <!-- existing Audit Logs <li> stays exactly as-is, then add: -->
                    <li class="nav-item">
                        <a
                             class="nav-link {% if request.url.path.startswith('/dashboard/settings') %}active{% endif %}"
                             {% if request.url.path.startswith('/dashboard/settings') %}aria-current="page"{% endif %}
                             href="/dashboard/settings"
                        >Settings</a>
                    </li>   
                </ul>
                {% if administrator %}
                <span class="navbar-text me-3">
                    Signed in as <strong>{{ administrator.username }}</strong>
                </span>
                <button id="logoutButton" type="button" class="btn btn-outline-light btn-sm">Log out</button>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
